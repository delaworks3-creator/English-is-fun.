<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Math Kelas 2 - Penjumlahan</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff4c2, #dff5ff);
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #333;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      font-size: 34px;
      color: #ff7b54;
      margin-bottom: 5px;
    }

    .school {
      font-size: 18px;
      font-weight: bold;
      color: #4b8bbe;
      margin-bottom: 20px;
    }

    .subtitle {
      font-size: 22px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 25px;
      padding: 25px;
      margin: 20px 0;
      box-shadow: 0 5px 15px rgba(0,0,0,0.12);
    }

    .number {
      font-size: 65px;
    }

    h2 {
      color: #4b8bbe;
    }

    .question {
      text-align: left;
      font-size: 20px;
      margin: 18px 0;
      padding: 18px;
      background: #f7f7f7;
      border-radius: 15px;
    }

    .question b {
      display: block;
      margin-bottom: 12px;
    }

    .question label {
      display: block;
      margin: 10px 0;
      padding: 10px;
      background: white;
      border-radius: 10px;
      cursor: pointer;
    }

    .question label:hover {
      background: #e7f7ff;
    }

    button {
      background: #ff9f43;
      border: none;
      color: white;
      padding: 15px 28px;
      border-radius: 15px;
      font-size: 20px;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      background: #ff7b54;
    }

    #result {
      font-size: 25px;
      font-weight: bold;
      margin-top: 25px;
    }

    .message {
      font-size: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🧮 MATH – KELAS 2</h1>

  <div class="school">
    SD N 71 MALUKU TENGAH
  </div>

  <div class="subtitle">
    🌟 Penjumlahan – Hitung Maju 🌟
  </div>

  <div class="card">

    <div class="number">🔢➕</div>

    <h2>🎯 KUIS PENJUMLAHAN</h2>

    <p>
      Pilih jawaban yang benar ya! 😊
    </p>

    <form id="quiz">

      <div class="question">
        <b>1. 3 + 2 = ...</b>
        <label><input type="radio" name="q1" value="a"> 4</label>
        <label><input type="radio" name="q1" value="b"> 5</label>
        <label><input type="radio" name="q1" value="c"> 6</label>
      </div>

      <div class="question">
        <b>2. 5 + 4 = ...</b>
        <label><input type="radio" name="q2" value="a"> 8</label>
        <label><input type="radio" name="q2" value="b"> 9</label>
        <label><input type="radio" name="q2" value="c"> 10</label>
      </div>

      <div class="question">
        <b>3. 6 + 3 = ...</b>
        <label><input type="radio" name="q3" value="a"> 8</label>
        <label><input type="radio" name="q3" value="b"> 9</label>
        <label><input type="radio" name="q3" value="c"> 10</label>
      </div>

      <div class="question">
        <b>4. 7 + 5 = ...</b>
        <label><input type="radio" name="q4" value="a"> 11</label>
        <label><input type="radio" name="q4" value="b"> 12</label>
        <label><input type="radio" name="q4" value="c"> 13</label>
      </div>

      <div class="question">
        <b>5. 8 + 4 = ...</b>
        <label><input type="radio" name="q5" value="a"> 11</label>
        <label><input type="radio" name="q5" value="b"> 12</label>
        <label><input type="radio" name="q5" value="c"> 13</label>
      </div>

      <div class="question">
        <b>6. 9 + 3 = ...</b>
        <label><input type="radio" name="q6" value="a"> 11</label>
        <label><input type="radio" name="q6" value="b"> 12</label>
        <label><input type="radio" name="q6" value="c"> 13</label>
      </div>

      <div class="question">
        <b>7. 6 + 7 = ...</b>
        <label><input type="radio" name="q7" value="a"> 12</label>
        <label><input type="radio" name="q7" value="b"> 13</label>
        <label><input type="radio" name="q7" value="c"> 14</label>
      </div>

      <div class="question">
        <b>8. 8 + 6 = ...</b>
        <label><input type="radio" name="q8" value="a"> 13</label>
        <label><input type="radio" name="q8" value="b"> 14</label>
        <label><input type="radio" name="q8" value="c"> 15</label>
      </div>

      <div class="question">
        <b>9. 9 + 7 = ...</b>
        <label><input type="radio" name="q9" value="a"> 15</label>
        <label><input type="radio" name="q9" value="b"> 16</label>
        <label><input type="radio" name="q9" value="c"> 17</label>
      </div>

      <div class="question">
        <b>10. 11 + 8 = ...</b>
        <label><input type="radio" name="q10" value="a"> 18</label>
        <label><input type="radio" name="q10" value="b"> 19</label>
        <label><input type="radio" name="q10" value="c"> 20</label>
      </div>

      <button type="button" onclick="checkQuiz()">
        ⭐ Lihat Nilai
      </button>

    </form>

    <div id="result"></div>

  </div>

</div>

<script>

function checkQuiz() {

  let score = 0;

  const answers = {
    q1: "b",
    q2: "b",
    q3: "b",
    q4: "b",
    q5: "b",
    q6: "b",
    q7: "b",
    q8: "b",
    q9: "b",
    q10: "b"
  };

  for (let question in answers) {

    let selected = document.querySelector(
      'input[name="' + question + '"]:checked'
    );

    if (selected && selected.value === answers[question]) {
      score++;
    }
  }

  let message = "";

  if (score === 10) {

    message =
      "🎉 SEMPURNA! Kamu hebat sekali! ⭐⭐⭐⭐⭐";

  } else if (score >= 8) {

    message =
      "🌟 Hebat! Terus berlatih ya! ⭐⭐⭐⭐";

  } else if (score >= 5) {

    message =
      "😊 Bagus! Ayo berlatih lagi! ⭐⭐⭐";

  } else {

    message =
      "💪 Jangan menyerah! Coba lagi ya! 🌈";

  }

  document.getElementById("result").innerHTML =
    "Nilaimu: " + score + " / 10<br><br>" +
    "<span class='message'>" + message + "</span>";
}

</script>

</body>
</html>
